# Model settings
model_name: "gemini-3.5-flash-lite"
temperature: 0.2          # low temperature -> more consistent JSON output
max_output_tokens: 2048

# Prompt file location
prompt_path: "prompts/ambiguity_prompt.txt"

# Which ambiguity types to check (all four, by default)
ambiguity_types:
  - lexical
  - syntactic
  - referential
  - pragmatic

# Test set used for evaluation
test_data_path: "data/test_sentences.json"
